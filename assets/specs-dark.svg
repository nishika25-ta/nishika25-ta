<svg xmlns="http://www.w3.org/2000/svg" width="900" height="278" viewBox="0 0 900 278" role="img" aria-label="Highlights and technical toolkit">
  <defs>
    <clipPath id="spec-clip-dark">
      <rect width="900" height="278" rx="3"/>
    </clipPath>
    <linearGradient id="spec-sheen-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101318"/>
      <stop offset="100%" stop-color="#0B0D10"/>
    </linearGradient>
    <filter id="spec-grain-dark" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <g clip-path="url(#spec-clip-dark)">
    <rect width="900" height="278" fill="url(#spec-sheen-dark)"/>
    <rect width="900" height="278" filter="url(#spec-grain-dark)" opacity="0.032"/>

    <!-- Top header rail & mid divider rail -->
    <rect x="0" y="0" width="900" height="34" fill="#0F1216"/>
    <rect x="0" y="132" width="900" height="34" fill="#0F1216"/>

    <!-- Specular bevel -->
    <line x1="1" y1="1.5" x2="899" y2="1.5" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>

    <!-- Structural horizontal hairlines -->
    <line x1="0" y1="34.5" x2="900" y2="34.5" stroke="#23272F" stroke-width="1"/>
    <line x1="0" y1="132.5" x2="900" y2="132.5" stroke="#23272F" stroke-width="1"/>
    <line x1="0" y1="166.5" x2="900" y2="166.5" stroke="#23272F" stroke-width="1"/>

    <!-- Gliding precision signal runner along toolkit header hairline -->
    <line x1="0" y1="166.5" x2="900" y2="166.5" stroke="#FF3B1D" stroke-width="1.3" stroke-dasharray="56 920" stroke-dashoffset="976" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="976" to="0" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- Band 1: 4 equal highlight dividers (y=34..132) -->
    <line x1="225.5" y1="34" x2="225.5" y2="132" stroke="#23272F" stroke-width="1"/>
    <line x1="450.5" y1="34" x2="450.5" y2="132" stroke="#23272F" stroke-width="1"/>
    <line x1="675.5" y1="34" x2="675.5" y2="132" stroke="#23272F" stroke-width="1"/>

    <!-- Band 2: 2 equal toolkit columns (y=166..278) -->
    <line x1="450.5" y1="166" x2="450.5" y2="278" stroke="#23272F" stroke-width="1"/>

    <!-- Band 1 header -->
    <text x="28" y="21" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="500" fill="#F4F5F7">01 / highlights</text>
    <text x="872" y="21" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#626975">verified record</text>

    <!-- 4 Verified Highlights with sequential cadence datum squares -->
    <rect x="28" y="51" width="5" height="5" fill="#FF3B1D">
      <animate attributeName="opacity" values="1;1;0.25;0.25;1" keyTimes="0;0.23;0.28;0.96;1" dur="12s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="28" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.8" fill="#F4F5F7">92<tspan fill="#FF3B1D">%</tspan></text>
    <text x="28" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9BA2AE">Aerial anomaly detection</text>
    <text x="28" y="123" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#626975">YOLO / TensorFlow</text>

    <rect x="253" y="51" width="5" height="5" fill="#FF3B1D" opacity="0.25">
      <animate attributeName="opacity" values="1;1;0.25;0.25;1" keyTimes="0;0.23;0.28;0.96;1" dur="12s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <text x="253" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.8" fill="#F4F5F7">1.1M</text>
    <text x="253" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9BA2AE">PE malware analysis</text>
    <text x="253" y="123" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#626975">412 features / SHAP</text>

    <rect x="478" y="51" width="5" height="5" fill="#FF3B1D" opacity="0.25">
      <animate attributeName="opacity" values="1;1;0.25;0.25;1" keyTimes="0;0.23;0.28;0.96;1" dur="12s" begin="6s" repeatCount="indefinite"/>
    </rect>
    <text x="478" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.8" fill="#F4F5F7">Sec<tspan fill="#FF3B1D">+</tspan></text>
    <text x="478" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9BA2AE">CompTIA Security+ (2026)</text>
    <text x="478" y="123" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#626975">IBM Python Data Science</text>

    <rect x="703" y="51" width="5" height="5" fill="#FF3B1D" opacity="0.25">
      <animate attributeName="opacity" values="1;1;0.25;0.25;1" keyTimes="0;0.23;0.28;0.96;1" dur="12s" begin="9s" repeatCount="indefinite"/>
    </rect>
    <text x="703" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.6" fill="#F4F5F7">UNIMAS</text>
    <text x="703" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9BA2AE">Dean&#8217;s List honoree</text>
    <text x="703" y="123" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#626975">Mobile App Dev Award</text>

    <!-- Band 2 header -->
    <text x="28" y="153" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="500" fill="#F4F5F7">02 / toolkit</text>
    <text x="872" y="153" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#626975">18 production tools</text>

    <!-- Stepping mechanical selector bar on left edge of toolkit -->
    <rect x="0" y="180" width="3" height="28" fill="#FF3B1D">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 0; 0 56; 0 56; 0 0"
        keyTimes="0; 0.45; 0.52; 0.94; 1"
        dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- Toolkit inner horizontal divider -->
    <line x1="28" y1="222.5" x2="424" y2="222.5" stroke="#191D24" stroke-width="1"/>
    <line x1="478" y1="222.5" x2="872" y2="222.5" stroke="#191D24" stroke-width="1"/>

    <!-- Left toolkit rows -->
    <text x="28" y="198" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#626975">languages</text>
    <text x="114" y="198" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#F4F5F7">Python / TypeScript / JS / C++ / Dart</text>

    <text x="28" y="254" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#626975">frontend</text>
    <text x="114" y="254" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#F4F5F7">React / Next.js / Tailwind / Flutter</text>

    <!-- Right toolkit rows -->
    <text x="478" y="198" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#626975">backend</text>
    <text x="554" y="198" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#F4F5F7">FastAPI / Flask / Node.js</text>

    <text x="478" y="254" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#626975">data / ops</text>
    <text x="554" y="254" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#F4F5F7">Postgres / Mongo / Docker / K8s / Git / Linux</text>
  </g>

  <rect x="0.5" y="0.5" width="899" height="277" rx="3" fill="none" stroke="#23272F" stroke-width="1"/>
</svg>
